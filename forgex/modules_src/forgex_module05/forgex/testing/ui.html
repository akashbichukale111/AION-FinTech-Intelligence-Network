<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORGEX · Testing & Regression Intelligence</title>
<style>
:root{--bg:#e8ebee;--panel:#fff;--ink:#101820;--mut:#5b6773;--line:#cfd5db;--acc:#0b5fff;--pass:#17794a;--fail:#b3261e;--warn:#a05a00;--unk:#6b7683;--pass-bg:#e3f3ea;--fail-bg:#fbe6e4;--warn-bg:#fbf0dc;--unk-bg:#eceff2;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--panel:#171e24;--ink:#e6ebef;--mut:#8f9ba6;--line:#2b353e;--acc:#6ea0ff;--pass:#4cc28a;--fail:#ff7b70;--warn:#e6a23c;--unk:#93a0ac;--pass-bg:#12301f;--fail-bg:#3a1a18;--warn-bg:#392b10;--unk-bg:#1f272e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0 8px 0 0;font-weight:650}h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input[type=text]{min-width:280px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--unk-bg);color:var(--mut)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--mut)}
.tabs button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;color:var(--mut);font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}.mut{color:var(--mut)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600}
.passed,.pass{background:var(--pass-bg);color:var(--pass)}.failed,.error,.fail,.timeout{background:var(--fail-bg);color:var(--fail)}
.skipped,.warn,.conditional,.incomplete,.queued,.running{background:var(--warn-bg);color:var(--warn)}.unknown{background:var(--unk-bg);color:var(--unk)}
.verdict{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;background:var(--panel)}
.verdict .big{padding:16px 22px;min-width:190px;display:flex;flex-direction:column;justify-content:center}
.verdict .big b{font-size:30px;line-height:1;letter-spacing:-.5px}.verdict .segs{display:flex;flex:1;flex-wrap:wrap}
.seg{flex:1 1 130px;padding:10px 12px;border-left:1px solid var(--line);font-size:12px}.seg b{display:block;font-size:12.5px;margin-bottom:2px}
.run{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}.run.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:340px;margin:6px 0;font:12px/1.5 var(--mono);white-space:pre-wrap}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:8px}
.bar{height:10px;background:var(--unk-bg);border-radius:5px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.ev{border-left:3px solid var(--line);padding:2px 10px;margin:4px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.err{color:var(--fail)}dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(900px,94vw);padding:16px}
</style></head><body>
<header><h1>Testing & Regression Intelligence</h1>
<input id="repo" type="text" placeholder="Repository path (or registered repository id)" aria-label="Repository path">
<button class="p" id="bDiscover">Discover tests</button><span class="badge" id="env">checking isolation…</span><span class="err" id="msg" role="status"></span></header>
<main><aside><div class="card"><h2>Run history</h2><div id="runs"><div class="empty">No runs yet. Discover tests, then start a run.</div></div>
<div class="row" style="margin-top:8px"><button id="bCompare" disabled>Compare selected (2)</button></div></div></aside>
<section><div class="tabs" id="tabs"></div><div id="view"></div></section></main>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button onclick="dlg.close()">Close</button></div></dialog>
<script>
const API='/api/v1/testing',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={tab:'discovery',repo:'',repoId:null,inv:null,runs:[],run:null,sel:new Set(),props:[],skipped:[],sub:'results',fin:null,cmp:null,poll:null};
const tabs=[['discovery','Discovery'],['generate','Generated tests'],['run','Run & results'],['fintech','FinTech simulations'],['compare','Compare runs']];
const st=(s)=>`<span class="st ${esc(s)}">${esc(s)}</span>`;
async function api(p,o){const r=await fetch(API+p,o&&{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
const say=(t,bad)=>{$('#msg').textContent=t||'';$('#msg').className=bad?'err':'mut'};const guard=f=>async(...a)=>{try{say('');await f(...a)}catch(e){say(e.message,1)}};
const repoBody=()=>({repo_path:$('#repo').value.trim()||undefined,repository_id:S.repoId||undefined});
function dur(s){return s==null?'—':s<1?Math.round(s*1000)+' ms':s.toFixed(1)+' s'}
async function boot(){const e=await api('/environment');const i=e.isolation;$('#env').textContent=i.docker?'isolation: docker (no network)':i.netns?'isolation: process + network namespace':'isolation: none for network — runs need explicit opt-in';await loadRuns();render()}
async function loadRuns(){S.runs=await api('/runs'+(S.repoId?`?repository_id=${encodeURIComponent(S.repoId)}`:''));const live=S.runs.some(r=>['queued','running'].includes(r.status));
 clearTimeout(S.poll);if(live||(S.run&&['queued','running'].includes(S.run.status)))S.poll=setTimeout(async()=>{if(S.run)S.run=await api('/runs/'+S.run.id);await loadRuns();render()},1200);
 $('#runs').innerHTML=S.runs.length?S.runs.map(r=>`<div class="run ${S.run?.id===r.id?'on':''}" data-id="${r.id}"><input type="checkbox" aria-label="select for compare" ${S.sel.has(r.id)?'checked':''} data-sel="${r.id}"><div><div>${st(r.verdict||r.status)} <span class="mono">${r.id.slice(4,10)}</span></div><div class="mut" style="font-size:12px">${r.summary.passed}/${r.summary.total} passed · ${dur(r.duration_seconds)}${r.line_pct!=null?` · ${r.line_pct}% cov`:''}</div><div class="mut" style="font-size:12px">${esc(r.created_at.slice(0,19).replace('T',' '))}</div></div></div>`).join(''):'<div class="empty">No runs yet.</div>';
 $('#bCompare').disabled=S.sel.size!==2}
$('#runs').onclick=guard(async e=>{const c=e.target.closest('[data-sel]');if(c){c.checked?S.sel.add(c.dataset.sel):S.sel.delete(c.dataset.sel);$('#bCompare').disabled=S.sel.size!==2;return}
 const r=e.target.closest('[data-id]');if(r){S.run=await api('/runs/'+r.dataset.id);S.tab='run';await loadRuns();render()}});
$('#bCompare').onclick=guard(async()=>{const [a,b]=[...S.sel];S.cmp=await api(`/runs/compare?a=${a}&b=${b}`);S.tab='compare';render()});
$('#bDiscover').onclick=guard(async()=>{S.inv=await api('/discover',repoBody());S.repoId=S.inv.repository_id;S.tab='discovery';await loadRuns();render()});
function render(){$('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('');$('#view').innerHTML=({discovery:vDiscovery,generate:vGenerate,run:vRun,fintech:vFintech,compare:vCompare})[S.tab]()}
function vDiscovery(){const d=S.inv;if(!d)return'<div class="empty">Enter a repository path and choose “Discover tests” to detect frameworks, test files and untested sources.</div>';const t=d.totals;
 return`<div class="card"><h2>Frameworks</h2>${d.frameworks.length?`<table><tr><th>Language</th><th>Framework</th><th>Evidence</th><th>Default command</th></tr>${d.frameworks.map(f=>`<tr><td>${f.language}</td><td><b>${esc(f.framework)}</b></td><td>${esc(f.evidence.join('; '))}</td><td class="mono">${esc(f.suggested_command)}</td></tr>`).join('')}</table>`:'<div class="empty">No test framework detected.</div>'}</div>
 <div class="grid2"><div class="card"><h2>Inventory</h2><div class="row"><div><b style="font-size:24px">${t.tests}</b><div class="mut">tests in ${t.test_files} files</div></div><div><b style="font-size:24px">${t.sources_with_tests}/${d.sources_total}</b><div class="mut">sources mapped to tests</div></div></div>
 <h3>By kind</h3>${Object.entries(t.by_kind).map(([k,v])=>`<span class="badge">${k}: ${v}</span> `).join('')||'<span class="mut">none</span>'}<h3>By language</h3>${Object.entries(t.by_language).map(([k,v])=>`<span class="badge">${k}: ${v}</span> `).join('')}</div>
 <div class="card"><h2>Weak or missing coverage indicators</h2>${d.weak_indicators.length?`<table>${d.weak_indicators.slice(0,12).map(w=>`<tr><td class="mono">${esc(w.file)}</td><td>${st(w.kind==='critical_source_untested'?'fail':'warn')} ${esc(w.detail)}</td></tr>`).join('')}</table>`:'<div class="mut">None found.</div>'}</div></div>
 <div class="card"><h2>Test files</h2><table><tr><th>File</th><th>Kind</th><th>Tests</th><th>Assertions</th><th>Covers</th></tr>${d.test_files.slice(0,60).map(f=>`<tr><td class="mono">${esc(f.path)}</td><td>${f.kind}</td><td>${f.tests}</td><td>${f.assertions}</td><td class="mono">${esc(f.sources.map(s=>s.path).join(', ')||'—')}</td></tr>`).join('')}</table></div>`}
function vGenerate(){return`<div class="card"><h2>Propose tests for a change</h2><div class="row"><input id="base" type="text" placeholder="Git base ref (e.g. main or HEAD~1)" style="min-width:260px"><button class="p" id="bGen">Generate proposals</button></div><p class="mut">Tests are derived from the changed functions’ signatures, documented errors and the previous implementation. Nothing is written to the repository until you approve.</p></div>
 ${S.skipped.length?`<div class="card"><h3>Skipped</h3>${S.skipped.map(s=>`<div class="mut"><span class="mono">${esc(s.path)}</span> — ${esc(s.reason)}</div>`).join('')}</div>`:''}
 ${S.props.length?S.props.map(p=>`<div class="card"><div class="row"><b class="mono">${esc(p.test_path)}</b>${st(p.status)}${p.kinds.map(k=>`<span class="badge">${k}</span>`).join('')}${p.validation.ok?'':st('fail')+' <span class="err">'+esc(p.validation.issues.join('; '))+'</span>'}<span style="flex:1"></span><button onclick="review('${p.id}')">Review code</button></div><div class="mut">Covers ${p.functions.map(f=>f.function+' ('+f.change+')').join(', ')||'API contract'} from <span class="mono">${esc(p.source_file)}</span></div>${p.notes.map(n=>`<div class="mut">• ${esc(n)}</div>`).join('')}</div>`).join(''):'<div class="empty">No proposals yet.</div>'}`}
document.addEventListener('click',guard(async e=>{if(e.target.id==='bGen'){const r=await api('/generate',{...repoBody(),base_ref:$('#base').value.trim()||undefined});S.props=r.proposals;S.skipped=r.skipped;render()}}));
window.review=id=>{const p=S.props.find(x=>x.id===id);$('#dlgBody').innerHTML=`<h2 class="mono">${esc(p.test_path)}</h2><pre>${esc(p.code)}</pre><div class="row"><button class="p" ${p.validation.ok&&p.status==='proposed'?'':'disabled'} onclick="decide('${id}','approve')">Approve & add to repository</button><button ${p.status==='proposed'?'':'disabled'} onclick="decide('${id}','reject')">Reject</button></div>`;dlg.showModal()};
window.decide=guard(async(id,d)=>{const r=await api(`/generate/${id}/review`,{decision:d,reviewer:'ui'});S.props=S.props.map(p=>p.id===id?r:p);dlg.close();render()});
function runForm(){return`<div class="card"><h2>Start an authorized test run</h2><div class="row"><input id="cmd" type="text" placeholder="Command (optional — defaults to detected framework)"><label>Timeout <input id="tmo" type="number" value="300" min="5" style="width:80px"> s</label>
 <label><input type="checkbox" id="cov" checked> coverage</label><label><input type="checkbox" id="fin"> FinTech simulations</label><select id="basesel" aria-label="baseline run"><option value="">No baseline</option>${S.runs.filter(r=>r.status==='passed'||r.status==='failed').map(r=>`<option value="${r.id}">baseline ${r.id.slice(4,10)} (${r.status})</option>`).join('')}</select><input id="gitbase" type="text" placeholder="git base ref for changes" style="min-width:170px"></div>
 <div class="row" style="margin-top:8px"><label><input type="checkbox" id="auth"> I authorize executing this repository’s tests in an isolated workspace</label><button class="p" id="bRun">Start run</button></div></div>`}
document.addEventListener('click',guard(async e=>{if(e.target.id!=='bRun')return;const b={...repoBody(),authorized:$('#auth').checked,command:$('#cmd').value.trim()||undefined,timeout_seconds:+$('#tmo').value,collect_coverage:$('#cov').checked,include_fintech:$('#fin').checked,base_run_id:$('#basesel').value||undefined,base_ref:$('#gitbase').value.trim()||undefined};
 S.run=await api('/runs',b);S.repoId=S.run.repository_id;S.sub='timeline';await loadRuns();render()}));
function vRun(){const r=S.run;if(!r)return runForm()+'<div class="empty">Select a run from the history, or start one above.</div>';const g=r.quality_gate;
 const v=g?`<div class="verdict"><div class="big ${g.verdict}"><span class="mut" style="font-size:12px">Quality gate</span><b>${g.verdict}</b><span style="font-size:12px">${g.score==null?'':'score '+g.score+' (informational)'}</span></div><div class="segs">${g.checks.map(c=>`<div class="seg"><b>${st(c.status)} ${esc(c.title)}</b>${esc(c.detail)}</div>`).join('')}</div></div>`
  :`<div class="verdict"><div class="big ${r.status}"><span class="mut" style="font-size:12px">Run ${esc(r.id.slice(4,10))}</span><b>${r.status}</b></div><div class="segs"><div class="seg">Quality gate is computed when the run finishes.</div></div></div>`;
 const subs=[['timeline','Timeline'],['results','Results'],['failures','Failures'],['regressions','Regressions'],['coverage','Coverage'],['gate','Gate evidence']];
 return runForm()+v+`<div class="tabs">${subs.map(([k,l])=>`<button class="${S.sub===k?'on':''}" onclick="S.sub='${k}';render()">${l}</button>`).join('')}</div>`+({timeline:sTimeline,results:sResults,failures:sFailures,regressions:sRegress,coverage:sCoverage,gate:sGate})[S.sub](r)}
function stackBar(s){const t=s.total||1,seg=(n,c)=>`<i style="width:${100*n/t}%;background:var(--${c})" title="${n}"></i>`;return`<div class="bar" role="img" aria-label="${s.passed} passed, ${s.failed+s.errors} failing, ${s.skipped} skipped">${seg(s.passed,'pass')}${seg(s.failed+s.errors,'fail')}${seg(s.skipped,'warn')}</div>`}
function sTimeline(r){const mx=Math.max(...r.commands.map(c=>c.duration_seconds),.1);return`<div class="card"><h2>Environment</h2><div class="mono">isolation=${r.environment.mode} · network_isolated=${r.environment.network_isolated} · python ${r.environment.python} · timeout ${r.environment.timeout_seconds}s · memory ${r.environment.memory_mb} MB · commit ${esc(r.commit_ref)}</div>${r.status_reason?`<p class="err">${esc(r.status_reason)}</p>`:''}</div>
 <div class="card"><h2>Execution</h2>${r.commands.map(c=>`<div class="row"><span class="mono" style="flex:1">${esc(c.command)}</span><span>exit ${c.exit_code??'—'}${c.timed_out?' · timed out':''}</span><span class="mut">${dur(c.duration_seconds)}</span></div><div class="bar"><i style="width:${100*c.duration_seconds/mx}%;background:var(--acc)"></i></div>`).join('')||'<span class="mut">Not started.</span>'}</div>
 <div class="card"><h2>Timeline</h2>${r.events.map(e=>`<div class="ev"><span class="mut mono">${esc(e.ts.slice(11,19))}</span> <b>${e.phase}</b> ${esc(e.message)}</div>`).join('')}</div>`}
function sResults(r){const s=r.summary;if(!s.total)return'<div class="empty">No test results were produced. This run cannot be counted as successful.</div>';return`<div class="card">${stackBar(s)}<div class="row mut" style="margin:8px 0">${s.passed} passed · ${s.failed} failed · ${s.errors} errors · ${s.skipped} skipped</div>
 <table><tr><th>Test</th><th>Status</th><th>Time</th></tr>${[...r.results].sort((a,b)=>(a.status==='passed')-(b.status==='passed')).slice(0,300).map(t=>`<tr><td class="mono">${esc(t.name)}</td><td>${st(t.status)}</td><td>${dur(t.duration)}</td></tr>`).join('')}</table></div>`}
function sFailures(r){if(!r.failure_groups.length)return`<div class="empty">${r.status==='passed'?'No failures.':'No analyzed failure groups for this run.'}</div>`;return r.failure_groups.map(g=>`<div class="card"><div class="row">${st(g.category)}<span class="st ${g.nature==='actual_failure'?'failed':'warn'}">${g.nature.replace('_',' ')}</span><b>${g.count} test(s)</b><span class="mut">confidence: ${g.confidence}</span></div>
 <p>${esc(g.likely_cause)}</p>${g.evidence.map(e=>`<div class="ev"><span class="mut">${e.type}</span> <span class="mono">${esc(e.text)}</span></div>`).join('')}${g.flaky_indicators.mixed_results_same_commit.length?`<p class="err">Flaky indicator: mixed results on the same commit — ${esc(g.flaky_indicators.mixed_results_same_commit.join(', '))}</p>`:''}<details><summary>Tests</summary><div class="mono">${g.tests.map(esc).join('<br>')}</div></details></div>`).join('')}
function sRegress(r){const g=r.regression;if(!g)return'<div class="empty">Regression analysis needs a change set: choose a baseline run or a git base ref when starting a run.</div>';
 const list=(t,a,f)=>a.length?`<h3>${t}</h3>${a.map(f).join('')}`:'';const risk=x=>`<div class="ev">${st(x.severity==='high'?'fail':x.severity==='medium'?'warn':'unknown')} <span class="mono">${esc(x.file)}</span> ${esc(x.detail)}</div>`;
 return`<div class="card"><div class="row"><h2 style="margin:0">Risk level</h2>${st(g.risk_level==='high'?'fail':g.risk_level==='medium'?'warn':'pass')}<span class="mut">${g.changed_files.length} changed file(s), ${g.affected_tests.length} affected test file(s), ${g.dependent_modules.length} dependent module(s)</span></div>
 ${list('Previously passing, now failing',g.newly_failing,x=>`<div class="ev err mono">${esc(x)}</div>`)}${list('API contract changes',g.api_contract_changes,risk)}${list('Migration risks',g.migration_risks,risk)}${list('Backward compatibility',g.compatibility_risks,risk)}
 ${list('Tests to run for this change',g.affected_tests,x=>`<div class="ev"><span class="mono">${esc(x.path)}</span> <span class="mut">${esc(x.reason)}</span></div>`)}${list('Dependent modules to validate',g.dependent_modules,x=>`<div class="ev mono">${esc(x.path)} <span class="mut">depth ${x.depth}</span></div>`)}
 ${g.comparison_available?'':'<p class="mut">No baseline run: pass/fail regressions could not be computed, only change-based risks.</p>'}</div>`}
let covCache={};function sCoverage(r){const c=covCache[r.id];if(c===undefined){api(`/runs/${r.id}/coverage`).then(x=>{covCache[r.id]=x;render()});return'<div class="mut">Loading…</div>'}
 if(!c.available)return`<div class="empty">No coverage data for this run. ${esc((c.report?.notes||[]).join('; '))}<br>Coverage is never estimated.</div>`;const t=c.coverage.total,files=Object.entries(c.coverage.files).sort((a,b)=>(a[1].line_pct??101)-(b[1].line_pct??101));
 const col=p=>p==null?'unk':p>=80?'pass':p>=60?'warn':'fail';
 return`<div class="card"><div class="row"><div><b style="font-size:26px">${t.line_pct}%</b><div class="mut">lines (${t.lines_covered}/${t.lines_total})</div></div><div><b style="font-size:26px">${t.branch_supported?t.branch_pct+'%':'n/a'}</b><div class="mut">${t.branch_supported?`branches (${t.branches_covered}/${t.branches_total})`:'branch data not in report'}</div></div>${c.comparison?.available?`<div><b style="font-size:26px">${c.comparison.total_delta>0?'+':''}${c.comparison.total_delta}</b><div class="mut">pts vs baseline</div></div>`:''}</div>
 <h3>Per file (lowest first) — ${esc(c.report.path)}</h3>${files.map(([f,d])=>`<div class="row"><span class="mono" style="width:260px;overflow:hidden;text-overflow:ellipsis">${esc(f)}</span><div class="bar" style="flex:1"><i style="width:${d.line_pct||0}%;background:var(--${col(d.line_pct)})"></i></div><span style="width:60px;text-align:right">${d.line_pct??'—'}%</span></div>`).join('')}</div>
 ${c.changed_code?`<div class="card"><h2>Changed code without coverage</h2>${c.changed_code.files.length?c.changed_code.files.map(f=>`<div class="ev">${f.critical&&(f.uncovered.length||f.status!=='measured')?st('fail')+' critical path ':''}<span class="mono">${esc(f.path)}</span> ${f.status==='measured'?`${f.changed_line_pct}% of ${f.changed_lines} changed lines covered${f.uncovered.length?' · uncovered lines '+f.uncovered.slice(0,15).join(', '):''}`:'not present in coverage report'}</div>`).join(''):'<span class="mut">No changed lines.</span>'}</div>`:''}`}
function sGate(r){const g=r.quality_gate;if(!g)return'<div class="empty">Pending.</div>';return`<div class="card"><p class="mut">${esc(g.score_note)}</p>${g.checks.map(c=>`<div class="ev"><b>${st(c.status)} ${esc(c.title)}</b>${c.critical?' <span class="err">critical</span>':''}<div>${esc(c.detail)}</div>${(c.evidence||[]).filter(Boolean).map(e=>`<div class="mono mut">${esc(e)}</div>`).join('')}</div>`).join('')}${g.unknowns.length?`<p class="mut">Not assessed: ${g.unknowns.join(', ')}</p>`:''}</div>`}
function vFintech(){const f=S.fin||S.run?.fintech;return`<div class="card"><h2>FinTech transaction simulations</h2><p class="mut">Deterministic, synthetic, in-memory. Decimal-only money; floats are rejected. No network, no real funds.</p><div class="row"><button class="p" id="bFin">Run reference engine</button><button id="bFinBad">Run defective engine (proves the suite catches bugs)</button></div></div>
 ${f?`<div class="card"><div class="row"><b>${f.summary.passed}/${f.summary.total} passed</b><span class="badge">engine: ${f.mode}</span></div>${f.scenarios.map(s=>`<details ${s.status!=='passed'?'open':''}><summary>${st(s.status)} ${esc(s.name)}</summary>${s.error?`<div class="err">${esc(s.error)}</div>`:''}${s.checks.map(c=>`<div class="ev">${c.ok?st('pass'):st('fail')} ${esc(c.check)} ${c.detail?`<span class="mono mut">${esc(c.detail)}</span>`:''}</div>`).join('')}</details>`).join('')}</div>`:'<div class="empty">No simulation results yet.</div>'}`}
document.addEventListener('click',guard(async e=>{if(e.target.id==='bFin'||e.target.id==='bFinBad'){S.fin=await api('/fintech-simulations',{mode:e.target.id==='bFin'?'reference':'defective'});render()}}));
function vCompare(){const c=S.cmp;if(!c)return'<div class="empty">Tick two runs in the history and choose “Compare selected”.</div>';
 const l=(t,a,f=x=>`<div class="ev mono">${esc(x)}</div>`)=>a.length?`<h3>${t} (${a.length})</h3>${a.map(f).join('')}`:'';
 return`<div class="card"><div class="row"><h2 style="margin:0">${c.a.id.slice(4,10)} → ${c.b.id.slice(4,10)}</h2>${st(c.verdict[0]||'unknown')} → ${st(c.verdict[1]||'unknown')}</div><table style="margin-top:8px"><tr><th></th><th>A</th><th>B</th></tr><tr><td>Commit</td><td class="mono">${esc(c.a.commit_ref.slice(0,10))}</td><td class="mono">${esc(c.b.commit_ref.slice(0,10))}</td></tr><tr><td>Passed / total</td><td>${c.a.summary.passed}/${c.a.summary.total}</td><td>${c.b.summary.passed}/${c.b.summary.total}</td></tr><tr><td>Duration</td><td>${dur(c.a.duration_seconds)}</td><td>${dur(c.b.duration_seconds)}</td></tr><tr><td>Line coverage</td><td>${c.a.line_pct??'—'}</td><td>${c.b.line_pct??'—'}</td></tr></table>
 ${l('New failures',c.new_failures)}${l('Fixed',c.fixed)}${l('Added tests',c.added)}${l('Removed tests',c.removed)}${l('Slower',c.slower,x=>`<div class="ev mono">${esc(x.name)} ${dur(x.a)} → ${dur(x.b)}</div>`)}</div>`}
$('#repo').onchange=()=>{S.repoId=null};boot().catch(e=>say(e.message,1));
</script></body></html>

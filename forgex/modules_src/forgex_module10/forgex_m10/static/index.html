<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORGEX · Release Risk & Governance Center</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#14171f;--mut:#667085;--line:#e4e7ec;--acc:#4f46e5;--ok:#067647;--okb:#d1fadf;--warn:#b54708;--warnb:#fef0c7;--bad:#b42318;--badb:#fee4e2;--nv:#475467;--nvb:#eaecf0;--pend:#175cd3;--pendb:#d1e9ff}
@media(prefers-color-scheme:dark){:root{--bg:#0d1017;--card:#161a23;--ink:#e8eaf0;--mut:#98a2b3;--line:#262c3a;--acc:#8b87ff;--ok:#6ce9a6;--okb:#0b3d2a;--warn:#fec84b;--warnb:#44310b;--bad:#fda29b;--badb:#4a1512;--nv:#c0c6d2;--nvb:#252b38;--pend:#84caff;--pendb:#12335c}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;letter-spacing:.2px}header h1 b{color:var(--acc)}.sp{flex:1}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.d{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.5}
main{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px 24px;max-width:1500px;margin:auto}@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.READY,.PASS,.VERIFIED,.LOW,.NONE,.READY_WITH_WARNINGS_,.VALID{background:var(--okb);color:var(--ok)}.READY_WITH_WARNINGS,.MEDIUM,.NOT_READY{background:var(--warnb);color:var(--warn)}
.BLOCKED,.FAIL,.FAILED,.HIGH,.CRITICAL,.REJECTED,.BROKEN{background:var(--badb);color:var(--bad)}.NOT_VERIFIED,.UNKNOWN,.NOT_APPLICABLE,.DRAFT{background:var(--nvb);color:var(--nv)}.PENDING_APPROVAL,.PENDING,.APPROVED{background:var(--pendb);color:var(--pend)}
.item{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}.item:hover,.item.sel{border-color:var(--acc)}.item small{color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border-radius:99px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
pre{background:var(--bg);padding:12px;border-radius:8px;overflow:auto;max-height:480px;font-size:12px;white-space:pre-wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}.scroll{overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi div{background:var(--bg);border-radius:10px;padding:12px}.kpi b{display:block;font-size:20px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(640px,94vw)}label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}dialog input,dialog textarea,dialog select{width:100%}
#toast{position:fixed;bottom:20px;right:20px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);display:none;max-width:480px;z-index:9}
</style></head><body>
<header><h1><b>FORGEX</b> · Release Risk & Governance Center</h1><span class="pill NOT_VERIFIED" id="who">not signed in</span><span class="sp"></span>
<input id="key" type="password" placeholder="X-API-Key" size="22"><button class="p" onclick="login()">Connect</button></header>
<main><aside><div class="row" style="margin-bottom:10px"><button class="p" onclick="openNew()">+ New candidate</button><button onclick="loadList()">↻</button></div>
<div id="queue" class="card" style="display:none"><h3>Human approval queue</h3><div id="qlist"></div></div><div id="list"></div></aside>
<section id="detail"><div class="card mut">Connect with an API key, then choose a release candidate. Everything shown here comes straight from the backend; nothing is simulated.</div></section></main>
<dialog id="dlg"><form method="dialog" onsubmit="return false"><h3 style="margin-top:0">New release candidate</h3>
<label>Version</label><input id="n_version"><label>Commit SHA</label><input id="n_commit"><label>Title</label><input id="n_title"><label>Author (human user id)</label><input id="n_author">
<label>Repo (optional) / PR number (optional, imports via GitHub provider)</label><div class="row"><input id="n_repo" style="flex:2"><input id="n_pr" style="flex:1" placeholder="PR #"></div>
<label>Unified diff (optional but required for patch-integrity verification)</label><textarea id="n_diff" rows="6"></textarea>
<label><input type="checkbox" id="n_fin" style="width:auto"> Financial / payment-impacting change</label>
<div class="row" style="margin-top:12px"><button class="p" onclick="createRel()">Create</button><button onclick="dlg.close()">Cancel</button></div></form></dialog>
<div id="toast"></div>
<script>
const $=s=>document.getElementById(s);let KEY=sessionStorage.k||"",ME=null,CUR=null,TAB="overview";const API="/api/v1";$("key").value=KEY;
const pill=s=>`<span class="pill ${s}">${String(s).replace(/_/g," ")}</span>`;const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,bad){const t=$("toast");t.textContent=m;t.style.display="block";t.style.background=bad?"var(--bad)":"";t.style.color=bad?"#fff":"";setTimeout(()=>t.style.display="none",5000)}
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{"X-API-Key":KEY,"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});
 const ct=r.headers.get("content-type")||"";const d=ct.includes("json")?await r.json():await r.text();if(!r.ok){const m=d.detail?(typeof d.detail==="string"?d.detail:d.detail.message+" "+JSON.stringify(d.detail.gates||{})):JSON.stringify(d);throw new Error(m)}return d}
async function login(){KEY=$("key").value;sessionStorage.k=KEY;try{ME=await api("/me");$("who").className="pill APPROVED";$("who").textContent=`${ME.id} · ${ME.role}${ME.kind=="agent"?" (AI agent)":""}`;loadList()}catch(e){toast(e.message,1)}}
async function loadList(){const l=await api("/releases/candidates");$("list").innerHTML=l.map(r=>`<div class="item ${CUR==r.id?"sel":""}" onclick="sel('${r.id}')"><div class="row"><b>${esc(r.version)}</b>${pill(r.status)}${pill(r.gate_status)}</div><div>${esc(r.title)}</div><small>${r.id} · ${esc(r.author)}${r.is_financial?" · 💳 financial":""}</small></div>`).join("")||'<div class="mut">No candidates yet.</div>';
 const q=await api("/releases/queue");$("queue").style.display=q.length?"block":"none";$("qlist").innerHTML=q.map(r=>`<div class="item" onclick="sel('${r.id}','approvals')"><b>${esc(r.version)}</b> ${esc(r.title)}</div>`).join("")}
function openNew(){$("dlg").showModal()}
async function createRel(){try{const pr=$("n_pr").value&&$("n_repo").value?{repo:$("n_repo").value,number:+$("n_pr").value}:null;
 const r=await api("/releases/candidates",{method:"POST",body:{version:$("n_version").value,commit_sha:$("n_commit").value,title:$("n_title").value,author:$("n_author").value,repo:$("n_repo").value||null,diff:$("n_diff").value||null,is_financial:$("n_fin").checked,pr}});$("dlg").close();await loadList();sel(r.id)}catch(e){toast(e.message,1)}}
async function sel(id,tab){CUR=id;if(tab)TAB=tab;loadList();render()}
const TABS=["overview","risk","verification","gates","evidence","fintech","approvals","rollback","audit","policies","report"];
async function render(){if(!CUR)return;let h=`<div class="tabs">${TABS.map(t=>`<button class="${t==TAB?"on":""}" onclick="TAB='${t}';render()">${t}</button>`).join("")}</div>`;$("detail").innerHTML=h+'<div class="card mut">Loading…</div>';
 try{$("detail").innerHTML=h+await V[TAB]()}catch(e){$("detail").innerHTML=h+`<div class="card"><span class="pill FAILED">error</span> ${esc(e.message)}</div>`}}
const chk=(a)=>`<table><tr><th>Check</th><th>Status</th><th>Detail</th><th>Evidence</th></tr>${a.map(c=>`<tr><td>${c.check}</td><td>${pill(c.status)}</td><td>${esc(c.detail)}</td><td class="mut">${(c.evidence_refs||[]).join(", ")}</td></tr>`).join("")}</table>`;
const act=(label,fn,cls="")=>`<button class="${cls}" onclick="${fn}">${label}</button>`;
async function doAct(path,body,ok){try{const r=await api(path,{method:"POST",body:body||{}});toast(ok||"Done: "+JSON.stringify(r).slice(0,160));render();loadList()}catch(e){toast(e.message,1);render()}}
const V={
async overview(){const r=await api("/releases/candidates/"+CUR),a=await api(`/releases/${CUR}/assurance`);
 return `<div class="card"><div class="row"><h2 style="margin:0">${esc(r.title)}</h2>${pill(a.status)}${pill(r.status)}</div><p class="mut">${esc(r.description)} · commit <code>${r.commit_sha}</code> · author ${esc(r.author)}${r.agent_id?` · agent <b>${r.agent_id}</b>`:""} · policy v${a.policy_version}</p>
 <div class="kpi"><div><span class="mut">Overall risk (max, not avg)</span><b>${pill(a.risk_summary.overall_severity)}</b></div><div><span class="mut">Assurance confidence</span><b>${a.risk_summary.assurance_confidence}</b></div><div><span class="mut">Files / lines</span><b>${r.changed_files.length} / +${r.lines_added} −${r.lines_removed}</b></div><div><span class="mut">Verified / Failed / Not verified</span><b>${a.verification.summary.VERIFIED} / ${a.verification.summary.FAILED} / ${a.verification.summary.NOT_VERIFIED}</b></div></div></div>
 <div class="card"><h3>Blockers & warnings</h3>${a.blockers.map(b=>`<div>${pill("BLOCKED")} ${esc(b)}</div>`).join("")||'<div class="mut">No blockers.</div>'}${a.warnings.map(b=>`<div>${pill("MEDIUM")} ${esc(b)}</div>`).join("")}</div>
 <div class="card"><h3>Change impact</h3><div class="scroll">${r.changed_files.map(f=>`<code>${esc(f)}</code>`).join("<br>")||"<span class='mut'>no files recorded</span>"}</div></div>
 <div class="card"><h3>Actions</h3><div class="row">${act("Collect from modules",`doAct('/releases/${CUR}/collect')`)}${act("Run risk assessment",`doAct('/releases/${CUR}/assess-risk',0,'Risk assessed')`)}${act("Run independent verification",`doAct('/releases/${CUR}/verify',0,'Verification complete')`)}${act("Submit for approval",`doAct('/releases/${CUR}/submit-approval')`,"p")}${act("Release notes",`TAB='report';render()`)}</div></div>`},
async risk(){const a=await api(`/releases/${CUR}/assess-risk`,{method:"POST"});return `<div class="card"><h3>Risk breakdown — ${pill(a.summary.overall_severity)} · unknown: ${a.summary.unknown_categories.join(", ")||"none"}</h3><div class="scroll"><table><tr><th>Category</th><th>Severity</th><th>Conf.</th><th>Factors</th><th>Impact</th><th>Mitigation</th><th>Evidence</th></tr>${a.risks.map(r=>`<tr><td><b>${r.category}</b></td><td>${pill(r.severity)}</td><td>${r.confidence}</td><td>${r.contributing_factors.map(esc).join("<br>")}</td><td>${esc(r.potential_impact)}</td><td>${esc(r.recommended_mitigation)}</td><td class="mut">${r.evidence_refs.join(", ")}</td></tr>`).join("")}</table></div></div>`},
async verification(){const v=await api(`/releases/${CUR}/verify`,{method:"POST"});return `<div class="card"><h3>Independent verification (execution evidence only; agent claims ignored)</h3>${["VERIFIED","FAILED","NOT_VERIFIED","NOT_APPLICABLE"].map(k=>`${pill(k)} ${v.summary[k]} `).join(" ")}<div class="scroll">${chk(v.checks)}</div></div>`},
async gates(){const a=await api(`/releases/${CUR}/gates`);return `<div class="card"><h3>Release gates → ${pill(a.status)}</h3><table><tr><th>#</th><th>Gate</th><th></th><th>Status</th><th>Detail</th></tr>${a.gates.map(g=>`<tr><td>${g.id}</td><td>${g.name}</td><td class="mut">${g.mandatory?"mandatory":"warning"}</td><td>${pill(g.status)}</td><td>${esc(g.detail)}</td></tr>`).join("")}</table><p class="mut">Approval requirement: ≥${a.approval_requirement.min_approvers} humans, roles ${a.approval_requirement.required_roles.join(", ")||"any"} (tier ${a.approval_requirement.risk_tier})</p></div>`},
async evidence(){const e=await api(`/releases/${CUR}/evidence`);return `<div class="card"><h3>Evidence (Modules 01–09)</h3><table><tr><th>Module</th><th>Kind</th><th>Usable</th><th>Collector</th><th>Commit</th><th>Collected</th></tr>${e.map(x=>`<tr><td>${x.module}</td><td>${x.kind}</td><td>${x.usable?pill("VERIFIED"):pill("FAILED")+" "+esc(x.problem)}</td><td>${esc(x.collector)}</td><td><code>${(x.commit_sha||"—").slice(0,10)}</code></td><td class="mut">${x.collected_at.slice(0,19)}</td></tr>`).join("")}</table></div>
 <div class="card"><h3>Submit evidence</h3><div class="row"><select id="e_kind">${["architecture","plan","patch","nightshift","tests","fintech","api","security","incidents","config","migration","rollback"].map(k=>`<option>${k}</option>`).join("")}</select><input id="e_commit" placeholder="commit sha (blank = unbound)" style="flex:1"></div><textarea id="e_payload" rows="6" style="width:100%;margin-top:8px" placeholder='{"executed":true,...}'></textarea><div style="margin-top:8px">${act("Record evidence","sendEv()","p")}</div></div>`},
async fintech(){const f=await api(`/releases/${CUR}/fintech-assurance`);return `<div class="card"><h3>FinTech assurance ${pill(f.status)}</h3>${f.checks.length?chk(f.checks.map(c=>({...c,evidence_refs:[]}))):'<span class="mut">Not a financial release.</span>'}<p class="mut">Decimal-based recomputation; synthetic transactions only; this module never authorizes real payments.</p></div>`},
async approvals(){const r=await api("/releases/candidates/"+CUR);return `<div class="card"><h3>Approvals (current cycle ${r.cycle})</h3><table><tr><th>Kind</th><th>Decision</th><th>Actor</th><th>Role</th><th>Cycle</th><th>Expires</th><th>Comment</th></tr>${r.approvals.map(a=>`<tr><td>${a.kind}</td><td>${pill(a.decision=="approve"?"VERIFIED":"FAILED")} ${a.decision}</td><td>${a.actor}</td><td>${a.role}</td><td>${a.cycle}</td><td class="mut">${a.expires_at.slice(0,16)}</td><td>${esc(a.comment)}</td></tr>`).join("")||"<tr><td colspan=7 class='mut'>none</td></tr>"}</table>
 <div class="row" style="margin-top:12px"><select id="d_kind"><option value="release">release approval</option><option value="code_review">code review</option></select><input id="d_c" placeholder="comment (required for reject)" style="flex:1">${act("Approve","decide('approve')","p")}${act("Reject","decide('reject')","d")}</div>
 <p class="mut">Server enforces role, human-only, no self-approval and separation of duties; the buttons just call the API. Status: ${pill(r.status)}</p><div class="row">${act("Record outcome: released",`doAct('/releases/${CUR}/outcome',{outcome:'released'},'Outcome recorded (no deployment performed)')`)}${act("Try deploy (must be disabled)",`doAct('/releases/${CUR}/deploy')`)}</div></div>`},
async rollback(){const r=await api(`/releases/${CUR}/rollback-readiness`);return `<div class="card"><h3>Rollback readiness ${pill(r.status)}</h3>${chk(r.checks)}<h3 style="margin-top:16px">Generated rollback plan</h3><pre>${r.rollback_plan.map(esc).join("\n")}</pre></div>`},
async audit(){const [a,v]=await Promise.all([api(`/governance/audit?release_id=${CUR}`),api("/governance/audit/verify")]);return `<div class="card"><h3>Audit chain ${pill(v.valid?"VALID":"BROKEN")} · ${v.records} records · head <code>${v.head_hash.slice(0,16)}…</code></h3>${v.problems.map(p=>`<div>${pill("FAILED")} seq ${p.seq}: ${p.problem}</div>`).join("")}<p class="mut">${esc(v.limitation)}</p><div class="scroll"><table><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>State</th><th>Decision/Result</th><th>Policy</th><th>Hash</th></tr>${a.map(r=>`<tr><td>${r.seq}</td><td class="mut">${r.ts.slice(0,19)}</td><td>${r.actor}${r.agent_id?` <span class="mut">(agent ${r.agent_id})</span>`:""}</td><td>${r.action}</td><td>${r.prev_state||""}→${r.new_state||""}</td><td>${esc(r.decision||r.result||"")}</td><td>v${r.policy_version??"-"}</td><td class="mut"><code>${r.hash.slice(0,10)}</code></td></tr>`).join("")}</table></div></div>`},
async policies(){const p=await api("/governance/policies");return p.map(x=>`<div class="card"><h3>Policy v${x.version} ${x.active?pill("APPROVED")+" active":""}</h3><div class="mut">by ${x.created_by} · ${x.created_at.slice(0,19)}</div><pre>${esc(JSON.stringify(x.body,null,1))}</pre></div>`).join("")},
async report(){const t=await api(`/releases/${CUR}/report`);return `<div class="card"><h3>Release report</h3><pre>${esc(t)}</pre><button onclick="dl()">Download .md</button></div>`}};
async function sendEv(){try{await api(`/releases/${CUR}/evidence`,{method:"POST",body:{kind:$("e_kind").value,payload:JSON.parse($("e_payload").value||"{}"),commit_sha:$("e_commit").value||null}});toast("Evidence recorded");render()}catch(e){toast(e.message,1)}}
function decide(d){doAct(`/releases/${CUR}/${d}`,{kind:$("d_kind").value,comment:$("d_c").value},"Decision recorded")}
async function dl(){const t=await api(`/releases/${CUR}/report`);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/markdown"}));a.download=`release-${CUR}.md`;a.click()}
if(KEY)login();
</script></body></html>
